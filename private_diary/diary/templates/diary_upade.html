{% extends 'base.html' %}
{% load static %}

{% block title %}日記編集|Private Diary{% endblock %}

{% block contents %}
<div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit">作成</button>
        <a href="{% url 'diary:diary_detail' object.pk %}">キャンセル</a>
    </form>
</div>
{% endblock %}
